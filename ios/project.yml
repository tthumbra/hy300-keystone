# XcodeGen spec for the iOS app (the .xcodeproj is generated in CI: `xcodegen generate`).
name: KeystoneLiDAR
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  KeystoneCore:
    path: .
targets:
  KeystoneLiDAR:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: KeystoneCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Keystone
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: The camera finds the projected picture and measures it on the wall.
        NSLocalNetworkUsageDescription: Talks to the projector on your Wi-Fi to adjust its keystone.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hy300keystone.calibrate
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  HY300Remote:
    type: application
    platform: iOS
    sources: [Remote, Shared]
    info:
      path: Remote/Info.plist
      properties:
        CFBundleDisplayName: HY300 Remote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: The camera scans the pairing QR code shown by the projector.
        NSLocalNetworkUsageDescription: Controls the projector on your Wi-Fi.
        NSBonjourServices: [_hykeystone._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hy300keystone.remote
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
