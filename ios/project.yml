# XcodeGen spec for the iPhone app (the .xcodeproj is generated in CI: `xcodegen generate`).
# One app, two tabs: Remote (trackpad/keyboard/keys) and Keystone (LiDAR calibration).
name: HY300
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  KeystoneCore:
    path: .
targets:
  HY300:
    type: application
    platform: iOS
    sources: [App, Remote, Shared]
    dependencies:
      - package: KeystoneCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HY300
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: The camera scans the projector's pairing QR code and measures the projected picture on the wall.
        NSLocalNetworkUsageDescription: Controls the projector and adjusts its keystone over your Wi-Fi.
        NSBonjourServices: [_hykeystone._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # Same bundle ID as the earlier "Keystone" app, so SideStore updates it in place.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hy300keystone.calibrate
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
