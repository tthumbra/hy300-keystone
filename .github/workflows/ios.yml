name: iOS app

on:
  push:
    paths: ["ios/**", "app/assets/web/keystone.js", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Core tests (same answers as the web page's keystone.js)
        run: swift test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned; Sideloadly signs it when installing)
        run: |
          xcodebuild -project KeystoneLiDAR.xcodeproj -scheme KeystoneLiDAR -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KeystoneLiDAR.app Payload/
          zip -qry KeystoneLiDAR.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KeystoneLiDAR-ipa
          path: ios/KeystoneLiDAR.ipa
