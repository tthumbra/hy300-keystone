name: iOS app

on:
  push:
    paths: ["ios/**", "app/assets/web/keystone.js", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to publish releases

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      VERSION: "0.1.${{ github.run_number }}"
      BUILD: "${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - name: Core tests (same answers as the web page's keystone.js)
        run: swift test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build both apps (unsigned; SideStore/Sideloadly sign them when installing)
        run: |
          for scheme in KeystoneLiDAR HY300Remote; do
            xcodebuild -project KeystoneLiDAR.xcodeproj -scheme "$scheme" -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          done

      - name: Package .ipa files
        run: |
          for app in KeystoneLiDAR HY300Remote; do
            rm -rf Payload && mkdir Payload
            cp -R "build/Build/Products/Release-iphoneos/$app.app" Payload/
            zip -qry "$app.ipa" Payload
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: |
            ios/KeystoneLiDAR.ipa
            ios/HY300Remote.ipa

      # SideStore source: add https://github.com/<owner>/<repo>/releases/latest/download/source.json
      - name: Publish release with SideStore source
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$BUILD"
          python3 tools/make-source.py "${{ github.repository }}" "$TAG" "$VERSION" "$BUILD" source.json
          gh release create "$TAG" KeystoneLiDAR.ipa HY300Remote.ipa source.json --title "HY300 apps $VERSION" --latest \
            --notes "iPhone apps build $BUILD: Keystone (calibration) and HY300 Remote. Install with SideStore by adding this source: https://github.com/${{ github.repository }}/releases/latest/download/source.json — or download the .ipa files for Sideloadly."
