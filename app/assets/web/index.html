<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Projector remote</title>
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --line: #2a303a; --text: #e8ecf1; --muted: #98a2b0;
    --accent: #5aa9ff; --good: #5fd08f; --warn: #ffc857; --bad: #ff7a7a; --key: #262c36;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overscroll-behavior: none; }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(10px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
    -webkit-user-select: none; user-select: none;
  }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  h1 { font-size: 1.15rem; margin: 0; flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.good { background: var(--good); } .dot.bad { background: var(--bad); }

  #pad {
    height: 36vh; min-height: 180px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: .88rem; padding: 12px; touch-action: none;
  }
  #pad.active { border-color: var(--accent); }

  button {
    border: 0; border-radius: 12px; background: var(--key); color: var(--text);
    font: inherit; font-weight: 600; padding: 0; min-height: 52px; touch-action: manipulation; cursor: pointer;
  }
  button:active, button.down { background: #364050; }
  button.ok { background: var(--accent); color: #06121f; }
  button svg { width: 22px; height: 22px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .row { display: grid; gap: 8px; margin-top: 8px; }
  .row.three { grid-template-columns: repeat(3, 1fr); }
  .row.four { grid-template-columns: repeat(4, 1fr); }
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px auto 0; max-width: 300px; }
  .dpad button { min-height: 58px; }
  .dpad .gap { visibility: hidden; }

  .type { display: grid; grid-template-columns: 1fr 56px 56px; gap: 8px; margin-top: 8px; }
  .type input {
    min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font: inherit; padding: 0 14px; min-height: 52px; -webkit-user-select: text; user-select: text;
  }
  .type input::placeholder { color: var(--muted); }
  .more { margin: 14px 0 0; text-align: center; font-size: .92rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>Projector remote</h1>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <div id="pad">Drag to move the pointer · tap to click<br>two fingers to scroll</div>

  <div class="row three">
    <button data-key="4" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg> Back</button>
    <button data-key="3" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg> Home</button>
    <button data-key="82" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg> Menu</button>
  </div>

  <div class="dpad">
    <button class="gap" tabindex="-1" aria-hidden="true"></button>
    <button data-key="19" data-repeat aria-label="Up"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="gap" tabindex="-1" aria-hidden="true"></button>
    <button data-key="21" data-repeat aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button data-key="23" class="ok" aria-label="OK">OK</button>
    <button data-key="22" data-repeat aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="gap" tabindex="-1" aria-hidden="true"></button>
    <button data-key="20" data-repeat aria-label="Down"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
    <button class="gap" tabindex="-1" aria-hidden="true"></button>
  </div>

  <div class="row four">
    <button data-key="25" data-repeat aria-label="Volume down">Vol −</button>
    <button data-key="164" aria-label="Mute">Mute</button>
    <button data-key="24" data-repeat aria-label="Volume up">Vol +</button>
    <button data-key="85" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M5 5l8 7-8 7zM16 5v14M20 5v14"/></svg></button>
  </div>

  <div class="type">
    <input id="text" type="text" placeholder="Type on the projector" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
    <button data-key="67" data-repeat aria-label="Backspace"><svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6zM13 10l4 4M17 10l-4 4"/></svg></button>
    <button data-key="66" aria-label="Enter"><svg viewBox="0 0 24 24"><path d="M19 6v7H6M10 9l-4 4 4 4"/></svg></button>
  </div>

  <p class="more"><a id="keystoneLink" href="keystone.html">Picture not square? Fix the keystone →</a></p>

  <script src="remote.js"></script>
</body>
</html>
